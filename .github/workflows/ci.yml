name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai:
    name: AI service (tests + eval baseline + contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (no API keys; providers are mocked)
        run: pytest -q
      - name: Offline eval must not fall below eval/baseline.json
        run: make eval-gate
      - name: Shared contract examples are up to date
        run: python scripts/export_contract_examples.py --check
      - name: Lint new modules
        run: ruff check app/core/providers app/infra/auth.py tests/test_provider_router.py tests/test_app_clients.py tests/test_contract.py

  typescript:
    name: TypeScript (typecheck, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Generated catalog matches the AI knowledge base
        run: python3 scripts/generate_catalog.py --check

  supabase:
    name: Supabase migrations + RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y postgresql-client >/dev/null
      - run: scripts/test-supabase.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scan-secrets.mjs
